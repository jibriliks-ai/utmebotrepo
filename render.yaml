
services:
  - type: web
    name: utme-webhook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook_server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_HASH
        value: utme_secret_hash_123
      - key: PREMIUM_PRICE
        value: 2000
      - key: RUN_MODE
        value: web

  - type: worker
    name: utme-bot-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALOC_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: PREMIUM_PRICE
        value: 2000
      - key: RUN_MODE
        value: bot
