
services:
  - type: web
    name: utme-success-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALOC_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_HASH
        value: utme_secret_hash_123
      - key: PREMIUM_PRICE
        value: 2000
